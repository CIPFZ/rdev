name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build embedded agents
        run: make GO=go agents

      - name: Build platform archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in darwin-arm64 linux-amd64 windows-amd64; do
            os="${target%-*}"
            arch="${target#*-}"
            out="rdev-${GITHUB_REF_NAME}-${target}"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-X github.com/CIPFZ/rdev/internal/buildinfo.Version=$version -X github.com/CIPFZ/rdev/internal/buildinfo.Commit=$GITHUB_SHA -X github.com/CIPFZ/rdev/internal/buildinfo.CommitTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -o "$out/rdev" ./cmd/rdev
            # rdevd currently depends on Unix peer credentials and sockets;
            # Windows receives the client/agent artifact until a native daemon
            # implementation is complete.
            if [[ "$os" != windows ]]; then
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags="-X github.com/CIPFZ/rdev/internal/buildinfo.Version=$version -X github.com/CIPFZ/rdev/internal/buildinfo.Commit=$GITHUB_SHA -X github.com/CIPFZ/rdev/internal/buildinfo.CommitTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                -o "$out/rdevd" ./cmd/rdevd
            fi
            cp README.md "$out/"
            if [[ "$os" == windows ]]; then
              mv "$out/rdev" "$out/rdev.exe"
              (cd "$out" && zip -q -r "../dist/$out.zip" .)
            else
              tar -C "$out" -czf "dist/$out.tar.gz" .
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
