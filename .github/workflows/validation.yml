name: Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# This workflow never receives signing credentials and never publishes/deploys.
# A production signing workflow requires separately authorized trust and identity.
permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # Exact historical engineering predecessor, not a fabricated version string.
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.8'
          cache: true
      - name: Install local SSH fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-server rsync acl
          sudo install -d -m 755 /run/sshd
      - name: Bind runner and tool identities
        run: |
          mkdir -p "$RUNNER_TEMP/rdev-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/rdev-evidence/source.txt"
          go version > "$RUNNER_TEMP/rdev-evidence/toolchain.txt"
          test "$(go env GOVERSION)" = "$(awk '$1 == "toolchain" {print $2}' go.mod)"
          ssh -V 2> "$RUNNER_TEMP/rdev-evidence/openssh.txt"
          printf '%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/rdev-evidence/run.txt"
      - name: Build, vet, test, and check embedded agents
        run: |
          make GO=go all daemon
          make GO=go check
      - name: Real historical-agent install and rollback windows
        run: |
          previous=e73a38bcd94c6ffb4dbe379578c3d46ff70fa50e
          # This pinned Go toolchain omits native VCS buildinfo in the linked
          # worktree layout. A separate clean clone preserves the identity that
          # the real binary tests require; do not relax that verification.
          git clone --quiet --no-hardlinks --no-local "$PWD" "$RUNNER_TEMP/rdev-predecessor"
          git -C "$RUNNER_TEMP/rdev-predecessor" checkout --quiet --detach "$previous"
          make -C "$RUNNER_TEMP/rdev-predecessor" GO="$(command -v go)" agents PLATFORMS=linux-amd64
          echo '::notice title=Installer preflight::historical native agent build completed'
          go test -c -o "$RUNNER_TEMP/real-agent-install.test" ./internal/agentinstall
          echo '::notice title=Installer preflight::test binary compiled'
          python3 scripts/real-agent-install.py \
            --test-binary "$RUNNER_TEMP/real-agent-install.test" \
            --current "$PWD/cmd/rdev/agents/rdev-agent-linux-amd64" \
            --current-commit "$GITHUB_SHA" \
            --current-sha256 "$(sha256sum cmd/rdev/agents/rdev-agent-linux-amd64 | cut -d ' ' -f 1)" \
            --previous "$RUNNER_TEMP/rdev-predecessor/cmd/rdev/agents/rdev-agent-linux-amd64" \
            --previous-commit "$previous" \
            --previous-sha256 "$(sha256sum "$RUNNER_TEMP/rdev-predecessor/cmd/rdev/agents/rdev-agent-linux-amd64" | cut -d ' ' -f 1)" \
            --out "$RUNNER_TEMP/rdev-evidence/install"
      - name: Summarize real installer failures
        if: failure()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rdev-evidence" / "install"
          result = root / "result.json"
          summary = {"report_present": result.exists(), "failed_tests": [], "test_diagnostics": []}
          if result.exists():
              report = json.loads(result.read_text())
              summary.update(status=report.get("status"), exit_code=report.get("exit_code"), agents=report.get("agents"))
          log = root / "test.log"
          if log.exists():
              content = log.read_text(errors="replace")
              summary["failed_tests"] = re.findall(r"--- FAIL: ([A-Za-z0-9_/=.-]+)", content)
              # This suite has only generated local state and no credentials,
              # SSH target, business commands or signing keys in its diagnostics.
              summary["test_diagnostics"] = re.findall(r"^\s*real_binary_test\.go:[0-9]+: .*$", content, re.M)
          print("::error title=Real installer diagnostics::" + json.dumps(summary, sort_keys=True))
          PY
      - name: Actual disk-full and read-only installation failures
        run: |
          status=0
          sudo python3 scripts/storage-faults.py \
            --go "$(command -v go)" \
            --current "$PWD/cmd/rdev/agents/rdev-agent-linux-amd64" \
            --current-commit "$GITHUB_SHA" \
            --previous "$RUNNER_TEMP/rdev-predecessor/cmd/rdev/agents/rdev-agent-linux-amd64" \
            --previous-commit e73a38bcd94c6ffb4dbe379578c3d46ff70fa50e \
            --out "$RUNNER_TEMP/rdev-evidence/storage" || status=$?
          if test -d "$RUNNER_TEMP/rdev-evidence/storage"; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/rdev-evidence/storage"
          fi
          exit "$status"
      - name: Real IPv4, IPv6 and ProxyJump runtime
        env:
          RDEV_TEST_SAFE_DIAGNOSTICS: '1'
        run: python3 scripts/isolated-ssh.py --go "$(command -v go)" --out "$RUNNER_TEMP/rdev-evidence/ssh"
      - name: Summarize SSH failures without test payloads
        if: failure()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rdev-evidence" / "ssh"
          summary = {"failed_tests": [], "source_locations": [], "failure_codes": [], "policy_readiness": [], "checks": {}}
          result = root / "result.json"
          if result.exists():
              data = json.loads(result.read_text())
              summary["checks"] = data.get("checks", {})
              summary["status"] = data.get("status")
          for log in [*root.glob("*-runtime.log"), root / "release-policy-preflight.log"]:
              if not log.exists():
                  continue
              content = log.read_text(errors="replace")
              summary["failed_tests"] += re.findall(r"--- FAIL: ([A-Za-z0-9_/]+)", content)
              summary["source_locations"] += re.findall(r"^\s*([A-Za-z0-9_]+_test\.go:[0-9]+):", content, re.M)
              summary["failure_codes"] += re.findall(r"RDEV_SAFE_FAILURE code=[a-zA-Z0-9_.]+ state=[a-zA-Z0-9_]+ stages=[a-z_,]*", content)
              summary["policy_readiness"] += re.findall(r"RDEV_SAFE_POLICY reason=[a-z_]+ explicit=(?:true|false)", content)
              summary["policy_readiness"] += re.findall(r"RDEV_SAFE_POLICY_COMPONENT depth=[0-9]+ status=[a-z_]+(?: owner=[a-z_]+ mode=[0-7]+ symlink=(?:true|false) directory=(?:true|false))?", content)
          summary["source_locations"] = sorted(set(summary["source_locations"]))
          summary["failure_codes"] = sorted(set(summary["failure_codes"]))
          message = json.dumps(summary, sort_keys=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("SSH diagnostic locations (no request or credential payloads):\n\n```json\n" + message + "\n```\n")
          print("::error title=SSH diagnostic locations::" + message)
          PY
      - name: Race instrumentation
        run: go test -race ./... -count=1 -timeout=20m
      - name: Coverage-guided fuzz smoke
        run: RDEV_GO=go RDEV_FUZZ_TIME=10s sh scripts/fuzz-smoke.sh
      - name: Harness supervision regressions
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Online release audit and artifact binding
        env:
          RDEV_RELEASE_OUT: ${{ runner.temp }}/rdev-evidence/release
        run: |
          make GO=go release-gate
          make GO=go verify-release
      - name: Independent clean build reproducibility
        env:
          RDEV_GO: go
          RDEV_REPRO_OUT: ${{ runner.temp }}/rdev-evidence/repro
        run: sh scripts/reproducible-build.sh
      - name: Isolated test-signature SSH upgrade and rollback
        run: |
          # This generated test identity has no production trust or secrets.
          # Keep policy ancestors outside the runner's extended home ACLs.
          fixture="/tmp/rdev-p8-signed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 scripts/prepare-signed-test-releases.py --go "$(command -v go)" \
            --out "$fixture" --frozen "$RUNNER_TEMP/rdev-evidence/release"
          python3 scripts/isolated-ssh.py --go "$(command -v go)" \
            --out "$RUNNER_TEMP/rdev-evidence/signed-ssh" \
            --signed-previous-policy "$fixture/previous-policy.json" \
            --signed-candidate-policy "$fixture/candidate-policy.json" \
            --signed-frozen-policy "$fixture/frozen-policy.json"
          python3 - <<'PY'
          import json, os, pathlib
          run = int(os.environ["GITHUB_RUN_ID"])
          attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          fixture = pathlib.Path(f"/tmp/rdev-p8-signed-{run}-{attempt}")
          prepared = json.loads((fixture / "result.json").read_text())
          runtime = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "rdev-evidence/signed-ssh/result.json").read_text())
          assert prepared["status"] == runtime["status"] == "passed"
          assert prepared["private_test_key_removed"] and prepared["signing_identity"]["test_only"]
          assert not prepared["official_identity"] and prepared["source_commit"] == os.environ["GITHUB_SHA"]
          assert all(v["status"] == "passed" and not v["draft_fixture"] and not v["source_dirty"] and v["inputs_unchanged"] for v in runtime["signed_runtime"].values())
          identity = {"run_id": run, "run_attempt": attempt, "source_commit": prepared["source_commit"], "official_identity": False}
          summary = {**identity, "signing_identity": prepared["signing_identity"], "ipv4_ipv6_proxyjump_signed_runtime": "passed"}
          annotations = [("Isolated signed test identity", summary)]
          for role in ("previous", "candidate", "frozen"):
              annotations.append(("Signed test bundle " + role, {**identity, "role": role, "bundle": prepared["bundles"][role]}))
          # Public annotation messages are truncated at 4096 bytes. Keep each
          # complete source/run/artifact identity independently readable.
          for title, record in annotations:
              message = json.dumps(record, sort_keys=True)
              assert len(message.encode("utf-8")) < 3500
              print("::notice title=" + title + "::" + message)
          PY
      - name: Summarize signed fixture failures without key or request contents
        if: failure()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          fixture = pathlib.Path(f"/tmp/rdev-p8-signed-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}")
          runtime = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rdev-evidence/signed-ssh"
          summary = {"preparation_report_present": (fixture / "result.json").exists(), "failed_steps": [], "failed_tests": [], "source_locations": []}
          if summary["preparation_report_present"]:
              report = json.loads((fixture / "result.json").read_text())
              summary.update(status=report.get("status"), failure_type=report.get("failure_type"), private_test_key_removed=report.get("private_test_key_removed"))
              summary["failed_steps"] = [{"name": row["name"], "exit_code": row["exit_code"]} for row in report.get("steps", []) if row.get("exit_code")]
          for log in runtime.glob("*-signed/signed-ssh.log"):
              content = log.read_text(errors="replace")
              summary["failed_tests"] += re.findall(r"--- FAIL: ([A-Za-z0-9_/=.-]+)", content)
              summary["source_locations"] += re.findall(r"^\s*([A-Za-z0-9_]+_test\.go:[0-9]+):", content, re.M)
          summary["source_locations"] = sorted(set(summary["source_locations"]))
          print("::error title=Signed fixture diagnostic locations::" + json.dumps(summary, sort_keys=True))
          PY
      - name: Record exact hosted artifact identities
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rdev-evidence"
          release = root / "release"
          manifest = json.loads((release / "manifest.json").read_text())
          repro = json.loads((root / "repro" / "result.json").read_text())
          source = os.environ["GITHUB_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", source)
          assert manifest["source"]["commit"] == source and manifest["source"]["dirty"] is False
          names = ["rdev", "rdevd", "rdev-agent-linux-amd64", "rdev-agent-linux-arm64", "rdev-agent-darwin-amd64", "rdev-agent-darwin-arm64"]
          assert len(manifest["artifacts"]) == 6 and {a["name"] for a in manifest["artifacts"]} == set(names)
          actual = {name: hashlib.sha256((release / name).read_bytes()).hexdigest() for name in names}
          assert all(actual[a["name"]] == a["sha256"] for a in manifest["artifacts"])
          assert repro["source_commit"] == source and repro["result"] == "passed" and len(repro["artifacts"]) == 6
          assert {pathlib.PurePosixPath(a["path"]).name for a in repro["artifacts"]} == set(names)
          assert all(a["first_sha256"] == a["second_sha256"] == actual[pathlib.PurePosixPath(a["path"]).name] for a in repro["artifacts"])
          metadata = ["manifest.json", "sbom.cdx.json", "provenance.intoto.json", "THIRD_PARTY_NOTICES.txt"]
          summary = {"source_commit": source, "run_id": int(os.environ["GITHUB_RUN_ID"]), "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]), "official_signature": False, "reproducible_release_bytes": True, "artifacts": actual, "metadata": {name: hashlib.sha256((release / name).read_bytes()).hexdigest() for name in metadata}}
          message = json.dumps(summary, sort_keys=True)
          (root / "artifact-identity.json").write_text(message + "\n")
          print("::notice title=Hosted artifact identities::" + message)
          PY
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Explicit evidence allowlist: failed SSH fixtures retain test keys
          # and principal credentials privately for recovery, never as uploads.
          path: |
            ${{ runner.temp }}/rdev-evidence/source.txt
            ${{ runner.temp }}/rdev-evidence/toolchain.txt
            ${{ runner.temp }}/rdev-evidence/openssh.txt
            ${{ runner.temp }}/rdev-evidence/run.txt
            ${{ runner.temp }}/rdev-evidence/artifact-identity.json
            ${{ runner.temp }}/rdev-evidence/install/result.json
            ${{ runner.temp }}/rdev-evidence/install/test.log
            ${{ runner.temp }}/rdev-evidence/storage/result.json
            ${{ runner.temp }}/rdev-evidence/storage/worker.log
            ${{ runner.temp }}/rdev-evidence/ssh/result.json
            ${{ runner.temp }}/rdev-evidence/ssh/release-policy-preflight.log
            ${{ runner.temp }}/rdev-evidence/ssh/recovery.json
            ${{ runner.temp }}/rdev-evidence/ssh/target-v4-runtime.log
            ${{ runner.temp }}/rdev-evidence/ssh/target-v6-runtime.log
            ${{ runner.temp }}/rdev-evidence/ssh/jump.log
            ${{ runner.temp }}/rdev-evidence/ssh/v4.log
            ${{ runner.temp }}/rdev-evidence/ssh/v6.log
            /tmp/rdev-p8-signed-${{ github.run_id }}-${{ github.run_attempt }}/result.json
            /tmp/rdev-p8-signed-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            /tmp/rdev-p8-signed-${{ github.run_id }}-${{ github.run_attempt }}/ephemeral-test-key.pub
            /tmp/rdev-p8-signed-${{ github.run_id }}-${{ github.run_attempt }}/*-policy.json
            /tmp/rdev-p8-signed-${{ github.run_id }}-${{ github.run_attempt }}/bundles/*/release.json
            /tmp/rdev-p8-signed-${{ github.run_id }}-${{ github.run_attempt }}/bundles/*/release.json.sig
            /tmp/rdev-p8-signed-${{ github.run_id }}-${{ github.run_attempt }}/bundles/*/manifest.json
            /tmp/rdev-p8-signed-${{ github.run_id }}-${{ github.run_attempt }}/bundles/*/sbom.cdx.json
            /tmp/rdev-p8-signed-${{ github.run_id }}-${{ github.run_attempt }}/bundles/*/provenance.intoto.json
            /tmp/rdev-p8-signed-${{ github.run_id }}-${{ github.run_attempt }}/bundles/*/THIRD_PARTY_NOTICES.txt
            /tmp/rdev-p8-signed-${{ github.run_id }}-${{ github.run_attempt }}/bundles/*/rdev*
            ${{ runner.temp }}/rdev-evidence/signed-ssh/result.json
            ${{ runner.temp }}/rdev-evidence/signed-ssh/recovery.json
            ${{ runner.temp }}/rdev-evidence/signed-ssh/*-runtime.log
            ${{ runner.temp }}/rdev-evidence/signed-ssh/*-signed/result.json
            ${{ runner.temp }}/rdev-evidence/signed-ssh/*-signed/signed-ssh.log
            ${{ runner.temp }}/rdev-evidence/release/
            ${{ runner.temp }}/rdev-evidence/repro/result.json
            ${{ runner.temp }}/rdev-evidence/repro/build-environment.json
            ${{ runner.temp }}/rdev-evidence/repro/module-verify.txt
            ${{ runner.temp }}/rdev-evidence/repro/first.log
            ${{ runner.temp }}/rdev-evidence/repro/second.log
            ${{ runner.temp }}/rdev-evidence/repro/first-toolchain.txt
            ${{ runner.temp }}/rdev-evidence/repro/second-toolchain.txt
          retention-days: 14
          if-no-files-found: error
